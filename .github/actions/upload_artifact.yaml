name: Build Fantasy Summary Reports

on:
  schedule:
    - cron: '22 35 * * 5' # Runs every Monday at midnight

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PDF Reports
        run: |
          python build_summary.py
        # PDFs müssen in ./reports/pdf liegen

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-summary-pdfs
          path: ./reports/pdf
