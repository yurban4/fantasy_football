name: Build Fantasy Summary and Deploy to Pages

on:
  schedule:
    - cron: "0 12 * * TUE"   # jeden Dienstag
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate summary
        run: python scripts/generate_summary.py

      - name: Copy markdown into site folder
        run: |
          mkdir -p site
          cp summaries/*.md site/

      - name: Create index.html
        run: |
          echo "<html><body><h1>Fantasy Summaries</h1><ul>" > site/index.html
          for f in site/*.md; do
            base=$(basename "$f" .md)
            pandoc "$f" -f markdown -t html -o "site/${base}.html"
            echo "<li><a href='${base}.html'>${base}</a></li>" >> site/index.html
          done
          echo "</ul></body></html>" >> site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
